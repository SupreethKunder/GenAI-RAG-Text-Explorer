[tool.poetry]
name = "rag_langchain_ollama"
version = "0.0.0"
description = "An implementation of RAG with Ollama Embeddings & Model (Mistral) over sample TXT files via Langchain wrapped as a Gradio Application"
authors = ["Supreeth Kunder <kundersupreeth@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
langchain = "^0.3.7"
gradio = "^4.44.1"
pymongo = {extras = ["srv"], version = "^4.10.1"}
requests = "^2.32.3"
pydantic = "^2.10.1"
pydantic-settings = "^2.6.1"
llama-index = "^0.12.0"
pre-commit = "^4.0.1"

[tool.poetry.scripts]
app = "src.cli:run"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
  "poetry-core",
]
